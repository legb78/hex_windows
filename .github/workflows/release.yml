name: Release

# Continuous deployment: any merge into main publishes the version declared in
# Directory.Build.props. If the matching tag already exists the workflow stops
# without doing anything, so a merge that does not bump the number publishes
# nothing and costs no more than reading a file.
#
# Releasing therefore comes down to bumping <Version> in a pull request.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: Anything to publish?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.read.outputs.version }}
      publish: ${{ steps.decide.outputs.publish }}

    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # This job runs on Linux: reading one XML file does not justify a Windows
      # runner, billed at double the rate.
      - name: Read the version
        id: read
        run: |
          version=$(grep -oPm1 '(?<=<Version>)[^<]+' Directory.Build.props)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Declared version: $version"

      - name: Does the tag already exist?
        id: decide
        run: |
          if git rev-parse "v${{ steps.read.outputs.version }}" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "v${{ steps.read.outputs.version }} is already published, nothing to do."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "v${{ steps.read.outputs.version }} is new, publishing."
          fi

  publish:
    name: Self-contained executable
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Install the .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      # The one place re-running the tests earns its keep: it guards the
      # artifact strangers will download. Nothing technically prevents a direct
      # push to main from an account allowed to bypass the rules, so this step
      # is the last net before publishing. A failure here means no release,
      # which beats shipping a broken one.
      - name: Unit tests
        run: dotnet test -c Release --filter "Category!=Integration"

      # Self-contained and single-file: the user installs nothing, not even the
      # .NET runtime. The sherpa-onnx native libraries are embedded and
      # extracted on first run.
      - name: Publish
        run: >
          dotnet publish src/HexWin/HexWin.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -o publish

      - name: Assemble the archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package | Out-Null
          Copy-Item publish/HexWin.exe package/
          Copy-Item publish/settings.json package/
          Copy-Item scripts/get-model.ps1 package/
          Copy-Item README.md, LICENSE, NOTICE package/
          Compress-Archive -Path package/* -DestinationPath HexWin-win-x64.zip

      - name: Create the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.check.outputs.version }}
          name: HexWin v${{ needs.check.outputs.version }}
          files: HexWin-win-x64.zip
          generate_release_notes: true
          body: |
            ## Install

            1. Unzip the archive wherever you like.
            2. Open PowerShell in that folder and run `.\get-model.ps1` to
               download the recognition model (about 480 MB).
            3. Double-click `HexWin.exe`.

            The tray icon starts grey while the model is checked, then turns
            blue. Hold `Ctrl` + `Windows`, speak, release.

            No .NET installation is required: everything is bundled.

            Windows will warn on first run, since the executable is not
            code-signed. Click **More info**, then **Run anyway**.
