name: Publication

# Déploiement continu : toute fusion vers main publie la version inscrite dans
# Directory.Build.props. Si l'étiquette correspondante existe déjà, le workflow
# s'arrête sans rien faire — une fusion qui ne monte pas le numéro ne publie
# donc rien, et le coût en minutes reste celui d'une lecture de fichier.
#
# Publier revient ainsi à monter <Version> dans une PR vers main.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verifier:
    name: Version à publier ?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.lecture.outputs.version }}
      publier: ${{ steps.controle.outputs.publier }}

    steps:
      - name: Récupération du code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Cette étape tourne sur Linux : lire un fichier XML ne justifie pas un
      # runner Windows, facturé le double.
      - name: Lecture de la version
        id: lecture
        run: |
          version=$(grep -oPm1 '(?<=<Version>)[^<]+' Directory.Build.props)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version déclarée : $version"

      - name: L'étiquette existe-t-elle déjà ?
        id: controle
        run: |
          if git rev-parse "v${{ steps.lecture.outputs.version }}" >/dev/null 2>&1; then
            echo "publier=false" >> "$GITHUB_OUTPUT"
            echo "v${{ steps.lecture.outputs.version }} est déjà publiée, rien à faire."
          else
            echo "publier=true" >> "$GITHUB_OUTPUT"
            echo "v${{ steps.lecture.outputs.version }} est nouvelle, publication."
          fi

  publier:
    name: Exécutable autonome
    needs: verifier
    if: needs.verifier.outputs.publier == 'true'
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Récupération du code
        uses: actions/checkout@v7

      - name: Installation du SDK .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      # The one place re-running the tests earns its keep: it guards the
      # artifact strangers will download. Branch protection is unavailable on a
      # private repository under the free plan, so nothing technically prevents
      # a direct push to main — this step is the last net before publishing. A
      # failure here means no release, which beats shipping a broken one.
      - name: Unit tests
        run: dotnet test -c Release --filter "Category!=Integration"

      # Autonome et en fichier unique : l'utilisateur n'a rien à installer,
      # pas même le runtime .NET. Les bibliothèques natives de sherpa-onnx
      # sont embarquées et extraites au premier lancement.
      - name: Publication
        run: >
          dotnet publish src/HexWin/HexWin.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -o publish

      - name: Assemblage de l'archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package | Out-Null
          Copy-Item publish/HexWin.exe package/
          Copy-Item publish/settings.json package/
          Copy-Item scripts/get-model.ps1 package/
          Copy-Item README.md, LICENSE, NOTICE package/
          Compress-Archive -Path package/* -DestinationPath HexWin-win-x64.zip

      - name: Création de la publication
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.verifier.outputs.version }}
          name: HexWin v${{ needs.verifier.outputs.version }}
          files: HexWin-win-x64.zip
          generate_release_notes: true
          body: |
            ## Installation

            1. Décompressez l'archive où vous voulez.
            2. Ouvrez PowerShell dans le dossier et lancez `.\get-model.ps1`
               pour télécharger le modèle (environ 480 Mo).
            3. Double-cliquez sur `HexWin.exe`.

            L'icône apparaît en gris le temps du chargement, puis passe au
            bleu. Maintenez alors `Ctrl` + `Windows`, parlez, relâchez.

            Aucune installation de .NET n'est nécessaire : tout est embarqué.
