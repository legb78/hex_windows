version: 2

updates:
  # NuGet dependencies
  - package-ecosystem: nuget
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    target-branch: develop
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: 'chore(deps)'
    groups:
      # Test packages move together and do not affect the shipped product:
      # grouping them avoids three pull requests for one version bump.
      tests:
        patterns:
          - 'xunit*'
          - 'Microsoft.NET.Test.Sdk'
          - 'coverlet.*'
      # sherpa-onnx and its native runtime must move together, for a more
      # serious reason: mismatched versions make loading the native library
      # fail outright.
      engine:
        patterns:
          - 'org.k2fsa.sherpa.onnx*'

  # GitHub Actions. The very first CI run flagged the Node.js 20 deprecation;
  # tracking them avoids rediscovering that kind of thing in the logs.
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    target-branch: develop
    labels:
      - dependencies
    commit-message:
      prefix: 'ci(deps)'
