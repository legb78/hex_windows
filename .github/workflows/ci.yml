name: CI

# Windows runners bill at double the Actions rate. The repository is public, so
# minutes are free today — but the settings below cost nothing and keep runs
# quick, which matters more than the invoice:
#   - paths-ignore  : no build when a documentation-only change lands on develop
#                     (on pull requests it is off on purpose, see below)
#   - concurrency   : a new push cancels the previous run of the same PR
#   - timeout       : caps a run that would otherwise spin
#   - NuGet cache   : avoids re-downloading packages every run

on:
  # No paths-ignore here, deliberately. The branch rules require the job below
  # to report before a pull request can merge, and a workflow that never
  # triggers never reports: a documentation-only pull request would wait for a
  # verdict that could not arrive, and no one could merge it — not even with
  # admin rights, since the rulesets grant no bypass. Found the hard way on a
  # pull request touching SECURITY.md alone.
  #
  # The wasted minute on a documentation change is the price of that guarantee,
  # and the repository being public, those minutes are free.
  pull_request:
    branches: [main, develop]
  # Pushes to main deliberately do NOT run here. A commit reaching main comes
  # from develop and was already validated by its pull request, and the release
  # workflow re-runs the tests before publishing. Keeping this trigger meant
  # three Windows test runs of the same commit for a single release, which was
  # simply waste.
  push:
    branches: [develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, tests and coverage
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Install the .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      # Fails if a dependency carries a known vulnerability, transitive ones
      # included. dotnet returns no error code in that case, so its output has
      # to be inspected — otherwise this check would be decorative.
      - name: Vulnerable dependencies
        shell: pwsh
        run: |
          $report = dotnet list package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Host $report
          if ($report -match 'has the following vulnerable packages') {
            Write-Error "A dependency carries a known vulnerability."
            exit 1
          }
          Write-Host "No vulnerable dependency." -ForegroundColor Green

      - name: Build
        run: dotnet build -c Release --no-restore

      # Formatting is checked after the build, not before: a syntax error would
      # produce a far less useful message here than from the compiler.
      - name: Formatting
        run: dotnet format --verify-no-changes --no-restore

      # The threshold covers the pure logic only. The Windows shells are marked
      # [ExcludeFromCodeCoverage], since they cannot be reached without a
      # microphone, a keyboard or an interactive session. Measuring them would
      # make the number meaningless.
      #
      # Integration tests are excluded: the model weighs 578 MB.
      - name: Tests and coverage
        run: >
          dotnet test -c Release --no-build
          --filter "Category!=Integration"
          -p:CollectCoverage=true
          -p:ExcludeByAttribute=ExcludeFromCodeCoverage
          -p:Threshold=75
          -p:ThresholdType=line
          -p:ThresholdStat=total
