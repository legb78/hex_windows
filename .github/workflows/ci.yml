name: CI

# Le dépôt est privé et les runners Windows sont facturés 2x les minutes
# Actions. Chaque réglage ci-dessous existe pour limiter la consommation :
#   - paths-ignore  : pas de build pour une modification de documentation
#   - concurrency   : un nouveau push annule le run précédent de la même PR
#   - timeout       : plafonne un run qui partirait en boucle
#   - cache NuGet   : évite de retélécharger les paquets à chaque run

on:
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  # Pushes to main deliberately do NOT run here. A commit reaching main comes
  # from develop and was already validated by its pull request, and the release
  # workflow re-runs the tests before publishing. Keeping this trigger meant
  # three Windows test runs of the same commit for a single release — billed at
  # double rate on a private repository.
  push:
    branches: [develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, tests et couverture
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Récupération du code
        uses: actions/checkout@v7

      - name: Installation du SDK .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Cache des paquets NuGet
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restauration
        run: dotnet restore

      # Échoue si une dépendance porte une faille connue, transitives
      # comprises. dotnet ne rend pas un code d'erreur dans ce cas : on
      # inspecte donc sa sortie.
      - name: Dépendances vulnérables
        shell: pwsh
        run: |
          $rapport = dotnet list package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Host $rapport
          if ($rapport -match 'has the following vulnerable packages') {
            Write-Error "Une dépendance porte une faille connue."
            exit 1
          }
          Write-Host "Aucune dépendance vulnérable." -ForegroundColor Green

      - name: Compilation
        run: dotnet build -c Release --no-restore

      # Le formatage est vérifié après la compilation : une erreur de syntaxe
      # donnerait ici un message bien moins clair que celui du compilateur.
      - name: Formatage
        run: dotnet format --verify-no-changes --no-restore

      # Les seuils portent sur la logique pure uniquement : les coquilles
      # Win32 sont marquées [ExcludeFromCodeCoverage], faute de pouvoir être
      # atteintes sans micro, clavier ni session interactive. Mesurer leur
      # couverture rendrait le chiffre insignifiant.
      #
      # Les tests d'intégration sont exclus : le modèle pèse 578 Mo.
      - name: Tests et couverture
        run: >
          dotnet test -c Release --no-build
          --filter "Category!=Integration"
          -p:CollectCoverage=true
          -p:ExcludeByAttribute=ExcludeFromCodeCoverage
          -p:Threshold=75
          -p:ThresholdType=line
          -p:ThresholdStat=total
